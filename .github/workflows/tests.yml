name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: python scripts/check_no_secrets.py
      - run: python -m pytest -q tests
      - run: python -m compileall -q app.py lib routes public_map/app.py
      - run: node --check static/js/dashboard/operations.js
      - run: node --check static/js/dashboard/corrections.js
      - run: node --check public_map/static/js/map.js
