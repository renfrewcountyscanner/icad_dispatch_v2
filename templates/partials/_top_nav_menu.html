<script>
async function toggleMuteNotifications() {
    const btn = document.getElementById('muteToggle');
    const icon = document.getElementById('muteIcon');
    const text = document.getElementById('muteText');

    // Get CSRF token from the meta tag injected by Flask-Session/CSRF
    const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || '';

    try {
        const response = await fetch('/api/systems/toggle-mute', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            }
        });
        const data = await response.json();
        
        if (data.muted) {
            icon.classList.remove('bi-bell-fill');
            icon.classList.add('bi-bell-slash-fill');
            text.textContent = 'Unmute notifications';
            btn.classList.remove('btn-success');
            btn.classList.add('btn-warning');
        } else {
            icon.classList.remove('bi-bell-slash-fill');
            icon.classList.add('bi-bell-fill');
            text.textContent = 'Mute notifications';
            btn.classList.remove('btn-warning');
            btn.classList.add('btn-success');
        }
        showAlert(data.message, 'success');
    } catch (err) {
        showAlert('Failed to toggle mute state', 'danger');
    }
}

document.addEventListener('DOMContentLoaded', function() {
    const muteBtn = document.getElementById('muteToggle');
    if (!muteBtn) return;
    
    fetch('/api/systems/mute-state')
        .then(r => r.json())
        .then(data => {
            const icon = document.getElementById('muteIcon');
            const text = document.getElementById('muteText');
            const btn = document.getElementById('muteToggle');
            if (data.muted) {
                icon.classList.remove('bi-bell-fill');
                icon.classList.add('bi-bell-slash-fill');
                text.textContent = 'Unmute notifications';
                btn.classList.remove('btn-success');
                btn.classList.add('btn-warning');
            } else {
                text.textContent = 'Mute notifications';
                btn.classList.add('btn-success');
            }
        });
});
</script>
