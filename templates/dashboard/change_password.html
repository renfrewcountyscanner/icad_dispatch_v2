{% extends 'dashboard/base.html' %}

{% block title %}Change Password - iCAD Dispatch{% endblock %}

{% block content %}
    <div class="row mb-3">
        <div class="col-12 d-flex mt-3">
            <div class="card flex-fill border-0 px-4 py-4">
                <div class="mb-3">
                    <h4>Change Password</h4>
                </div>
                <div class="row">
                    <div class="col-12 col-md-9 d-flex mt-3">
                        <form id="changePasswordForm" class="needs-validation mt-4 vw-100" novalidate>
                            <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
                            <div class="row g-3 mb-4">
                                <div class="col-10 mx-auto position-relative form-floating">
                                    <div id="changePasswordSuccess"
                                         class="alert alert-success text-center d-none formErrorSuccessFeedback"
                                         role="alert">
                                    </div>
                                    <div id="changePasswordError"
                                         class="alert alert-danger text-center d-none formErrorSuccessFeedback"
                                         role="alert">
                                    </div>
                                </div>
                            </div>
                            <div class="row g-3 mb-4">
                                <div class="col-10 mx-auto position-relative form-floating">
                                    <input autofocus type="password" class="form-control" id="currentPassword"
                                           name="currentPassword" required>
                                    <label for="currentPassword" class="form-label">Current Password</label>
                                    <button
                                            type="button"
                                            class="btn p-0 border-0 bg-transparent position-absolute top-50 end-0 translate-middle-y me-4"
                                            id="toggleCurrentPassword"
                                            aria-label="Show Password"
                                            tabindex="-1"
                                            style="cursor: pointer;"
                                    >
                                        <i class="bi bi-eye-fill" style="font-size: 1.40rem"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="row g-3 mb-4">
                                <div class="col-10 mx-auto position-relative form-floating">
                                    <input type="password" class="form-control" id="newPassword"
                                           name="newPassword" required>
                                    <label for="newPassword" class="form-label">New Password</label>
                                    <button
                                            type="button"
                                            class="btn p-0 border-0 bg-transparent position-absolute top-50 end-0 translate-middle-y me-4"
                                            id="toggleNewPassword"
                                            aria-label="Show Password"
                                            tabindex="-1"
                                            style="cursor: pointer;"
                                    >
                                        <i class="bi bi-eye-fill" style="font-size: 1.40rem"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="row g-3 mb-4">
                                <div class="col-10 mx-auto position-relative form-floating">
                                    <input type="password" class="form-control" id="confirmPassword"
                                           name="confirmPassword" required>
                                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                                    <button
                                            type="button"
                                            class="btn p-0 border-0 bg-transparent position-absolute top-50 end-0 translate-middle-y me-4"
                                            id="toggleConfirmPassword"
                                            aria-label="Show Password"
                                            tabindex="-1"
                                            style="cursor: pointer;"
                                    >
                                        <i class="bi bi-eye-fill" style="font-size: 1.40rem"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="row g-3 mb-4">
                                <div class="col-10 mx-auto">
                                    <button id="submitChangePasswordBtn" type="submit"
                                            class="btn primary-button registration-login-btn">
                                        Save Password
                                    </button>
                                    <button id="cancelChangePasswordBtn" type="reset"
                                            class="btn btn-outline-secondary" onclick="history.back()">
                                        Cancel
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS Validation Script -->
    <script>

        /**
         * Toggle the success / error alert boxes inside the change-password form.
         * @param {"success"|"danger"} type  Which alert to show.
         * @param {string} message           Message to place inside the alert.
         */
        function showFormMessage(type, message) {
            const successBox = document.getElementById("changePasswordSuccess");
            const errorBox   = document.getElementById("changePasswordError");

            // hide both first
            successBox.classList.add("d-none");
            errorBox.classList.add("d-none");

            if (type === "success") {
                successBox.textContent = message;
                successBox.classList.remove("d-none");
            } else {
                errorBox.textContent = message;
                errorBox.classList.remove("d-none");
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("changePasswordForm");
            const currentPassword = document.getElementById("currentPassword");
            const newPassword = document.getElementById("newPassword");
            const confirmPassword = document.getElementById("confirmPassword");

            const toggleCurrentPasswordButton = document.getElementById('toggleCurrentPassword');
            const toggleNewPasswordButton = document.getElementById('toggleNewPassword');
            const toggleConfirmPasswordButton = document.getElementById('toggleConfirmPassword');

            toggleCurrentPasswordButton.addEventListener('click', function () {
                const type = currentPassword.getAttribute('type') === 'password' ? 'text' : 'password';
                currentPassword.setAttribute('type', type);
                // Change eye icon based on the password visibility
                if (type === 'password') {
                    toggleCurrentPasswordButton.innerHTML = `<i class="bi bi-eye-fill" style="font-size: 1.40rem"></i>`
                } else {
                    toggleCurrentPasswordButton.innerHTML = `<i class="bi bi-eye-slash-fill" style="font-size: 1.40rem"></i>`
                }
            });

            toggleNewPasswordButton.addEventListener('click', function () {
                const type = newPassword.getAttribute('type') === 'password' ? 'text' : 'password';
                newPassword.setAttribute('type', type);
                // Change eye icon based on the password visibility
                if (type === 'password') {
                    toggleNewPasswordButton.innerHTML = `<i class="bi bi-eye-fill" style="font-size: 1.40rem"></i>`
                } else {
                    toggleNewPasswordButton.innerHTML = `<i class="bi bi-eye-slash-fill" style="font-size: 1.40rem"></i>`
                }
            });

            toggleConfirmPasswordButton.addEventListener('click', function () {
                const type = confirmPassword.getAttribute('type') === 'password' ? 'text' : 'password';
                confirmPassword.setAttribute('type', type);
                // Change eye icon based on the password visibility
                if (type === 'password') {
                    toggleConfirmPasswordButton.innerHTML = `<i class="bi bi-eye-fill" style="font-size: 1.40rem"></i>`
                } else {
                    toggleConfirmPasswordButton.innerHTML = `<i class="bi bi-eye-slash-fill" style="font-size: 1.40rem"></i>`
                }
            });

            form.addEventListener("submit", async function (event) {
                event.preventDefault();
                event.stopPropagation();

                newPassword.setCustomValidity("");
                confirmPassword.setCustomValidity("");

                const passRegex = /^(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}$/;
                if (!passRegex.test(newPassword.value)) {
                    showFormMessage("danger", "Password must be at least 8 characters, contain 1 digit and 1 symbol.");
                    newPassword.setCustomValidity(
                        "Password must be at least 8 characters, contain 1 digit and 1 symbol."
                    );
                    confirmPassword.setCustomValidity("Password must be at least 8 characters, contain 1 digit and 1 symbol.");
                }

                if (newPassword.value !== confirmPassword.value) {
                    showFormMessage("danger", "Passwords do not match.")
                    newPassword.setCustomValidity("Passwords do not match.")
                    confirmPassword.setCustomValidity("Passwords do not match.");
                }

                form.classList.add("was-validated");
                if (!form.checkValidity()) return;

                const formData = new FormData(form);

                try {
                    const response = await fetch("{{ url_for('auth.auth_change_password') }}", {
                        method: "POST",
                        headers: {
                            "X-Requested-With": "XMLHttpRequest"
                        },
                        body: formData
                    });

                    const data = await response.json();

                    if (data.success) {
                        showFormMessage("success", data.message);

                        form.reset();
                        form.classList.remove("was-validated");
                        // hide validation green borders set by Bootstrap
                        newPassword.classList.remove("is-valid");
                        confirmPassword.classList.remove("is-valid");
                        currentPassword.focus();
                    } else {
                        showFormMessage("danger", data.message);
                    }
                } catch (error) {
                    console.error("Error:", error);
                    showFormMessage("danger", error.toString());
                }
            });
        });
    </script>
{% endblock %}
