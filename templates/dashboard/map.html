{% extends "dashboard/base.html" %}

{% block title %}CAD Map - iCAD Dispatch{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
<style>
.map-container {
    display: flex;
    height: calc(100vh - 120px);
    margin: 1rem;
    gap: 1rem;
}
.sidebar {
    width: 350px;
    min-width: 300px;
    background: #1a1a2e;
    border-radius: 0.5rem;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
.sidebar-header {
    padding: 1rem;
    background: #16213e;
    border-bottom: 1px solid #333;
    color: #fff;
}
.sidebar-header h2 {
    margin: 0 0 0.5rem 0;
    font-size: 1.25rem;
}
.sidebar-controls {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    align-items: center;
}
.sidebar-controls input, .sidebar-controls select {
    background: #0f0f1a;
    border: 1px solid #333;
    color: #fff;
    padding: 0.25rem 0.5rem;
    border-radius: 0.25rem;
}
.sidebar-controls label {
    color: #aaa;
    font-size: 0.85rem;
}
.call-list {
    flex: 1;
    overflow-y: auto;
    padding: 0;
    margin: 0;
    list-style: none;
}
.call-item {
    padding: 0.75rem;
    border-bottom: 1px solid #333;
    cursor: pointer;
    transition: background 0.2s;
}
.call-item:hover {
    background: #16213e;
}
.call-item.active {
    background: #16213e;
    border-left: 3px solid #198754;
}
.call-item.fire {
    border-left: 3px solid #dc3545;
}
.call-item.ems {
    border-left: 3px solid #0d6efd;
}
.call-item.other {
    border-left: 3px solid #6c757d;
}
.call-time {
    color: #aaa;
    font-size: 0.85rem;
}
.call-category {
    color: #fff;
    font-weight: 500;
    margin: 0.25rem 0;
}
.call-address {
    font-size: 0.8rem;
    color: #666;
}
.call-system {
    font-size: 0.75rem;
    color: #888;
}
.map-view {
    flex: 1;
    border-radius: 0.5rem;
    overflow: hidden;
}
#map {
    height: 100%;
    width: 100%;
}
.live-indicator {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #198754;
    margin-right: 0.5rem;
}
.live-indicator.active {
    animation: pulse 1s infinite;
}
@keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
}
.stats {
    font-size: 0.75rem;
    color: #aaa;
}
.badge {
    padding: 0.25rem 0.5rem;
    border-radius: 0.25rem;
    font-size: 0.75rem;
    margin-right: 0.25rem;
}
.badge-fire { background: #dc3545; color: #fff; }
.badge-ems { background: #0d6efd; color: #fff; }
.badge-other { background: #6c757d; color: #fff; }
</style>
{% endblock %}

{% block content %}
<div class="map-container">
    <div class="sidebar">
        <div class="sidebar-header">
            <h2><i class="bi bi-geo-alt"></i> CAD Map</h2>
            <div class="sidebar-controls">
                <label>From:</label>
                <input type="date" id="startDate">
                <label>To:</label>
                <input type="date" id="endDate">
                <select id="categoryFilter">
                    <option value="">All</option>
                    <option value="fire">Fire</option>
                    <option value="medical">EMS</option>
                </select>
                <label>
                    <input type="checkbox" id="liveMode"> Live
                </label>
                <select id="refreshInterval">
                    <option value="5">5s</option>
                    <option value="15">15s</option>
                    <option value="30">30s</option>
                    <option value="60" selected>1m</option>
                    <option value="300">5m</option>
                </select>
            </div>
            <div class="stats mt-2">
                <span class="live-indicator" id="liveIndicator"></span>
                <span id="callCount">0 calls</span>
            </div>
        </div>
        <ul class="call-list" id="callList"></ul>
    </div>
    <div class="map-view">
        <div id="map"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<script src="{{ url_for('static', filename='js/dashboard/map.js') }}"></script>
{% endblock %}
