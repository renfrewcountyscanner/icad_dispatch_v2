# Production docker-compose using local build
# Use this file for development or if you want to build locally
# Run: docker compose -f docker-compose.production.yml up -d

services:
  icad_dispatch:
    build: .
    image: icad_dispatch_v2:local
    environment:
      - LOG_LEVEL=2
    env_file:
      - .env
    ports:
      - "9911:9911"
    volumes:
      - ./log:/app/log
      - ./var:/app/var
      - ./audio:/app/static/audio
    restart: unless-stopped

  public_map:
    build:
      context: ./public_map
      dockerfile: Dockerfile
    image: icad_public_map:local
    ports:
      - "5000:5000"
    volumes:
      - ./var:/app/shared_var
      - ./audio:/app/static/audio:ro
    environment:
      - ICAD_DB_PATH=/app/shared_var/icad_dispatch.db
      - BASE_URL=https://map.yoursite.com
      - SECRET_KEY=${MAP_SECRET_KEY:-change-me-in-production}
    restart: unless-stopped