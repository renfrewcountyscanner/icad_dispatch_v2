# Minimal compose: only icad_dispatch (no DB, no public_map).
# For full stack with PostgreSQL + public_map, use:
#   docker compose -f docker-compose.production.yml up -d

services:
  icad_dispatch:
    build: .
    image: icad_dispatch_v2:local
    environment:
      - LOG_LEVEL=2
    env_file:
      - .env
    ports:
      - "9911:9911"
    volumes:
      - ./log:/app/log
      - ./var:/app/var
      - ./audio:/app/static/audio
    restart: unless-stopped
